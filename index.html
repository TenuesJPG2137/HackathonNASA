<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #000; color: #eee; font-family: system-ui, sans-serif; }

  #bar {
    flex: none; display: flex; align-items: center; gap: .9rem; flex-wrap: wrap;
    padding: .5rem .9rem; background: #151515; font-size: .9rem; border-bottom: 1px solid #333;
  }
  #bar b.title { font-size: 1.05rem; }
  button { padding: .35rem .8rem; cursor: pointer; border: 1px solid #666; background: #222; color: #eee; border-radius: 4px; }
  button.active { background: #c1440e; border-color: #c1440e; }
  input[type=number] { width: 6rem; padding: .3rem; }
  #weights { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding-left: .9rem; border-left: 1px solid #333; }
  #weights input[type=number] { width: 4.2rem; }
  #weights button:disabled { opacity: .5; cursor: default; }
  #wstatus { color: #aaa; font-size: .85rem; }
  select { max-width: 22rem; padding: .3rem; background: #222; color: #eee; border: 1px solid #666; border-radius: 4px; }
  label { white-space: nowrap; }

  #split { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; position: relative; min-width: 0; }
  #globe, #earth { position: absolute; inset: 0; }
  #left { border-right: 2px solid #333; }
  /* Popup on the globe: same look as the Leaflet popup on the Earth map */
  .gpop { position: absolute; left: 0; top: 0; z-index: 1000; width: max-content; max-width: 580px;
    text-align: center; font: 12px/1.5 "Helvetica Neue", Arial, Helvetica, sans-serif; color: #333; }
  .gpop-box { position: relative; background: #fff; border-radius: 12px; padding: 1px; text-align: left;
    box-shadow: 0 3px 14px rgba(0, 0, 0, .4); }
  .gpop-content { margin: 13px 24px 13px 20px; line-height: 1.3; font-size: 13px; }
  .gpop-x { position: absolute; top: 0; right: 0; width: 24px; height: 24px; text-align: center;
    font: 16px/24px Tahoma, Verdana, sans-serif; color: #757575; text-decoration: none; }
  .gpop-x:hover { color: #585858; }
  .info details { margin-top: 6px; }
  .info summary { cursor: pointer; color: #0078a8; }
  .info img { display: block; width: min(520px, 78vw); margin-top: 6px; }
  .info .noimg { margin-top: 6px; color: #888; max-width: 280px; }
  .info .dist { color: #666; }
  .gpop-tipc { position: absolute; left: 50%; width: 40px; height: 20px; margin-left: -20px; margin-top: -1px;
    overflow: hidden; pointer-events: none; }
  .gpop-tip { width: 17px; height: 17px; padding: 1px; margin: -10px auto 0; background: #fff;
    transform: rotate(45deg); box-shadow: 0 3px 14px rgba(0, 0, 0, .4); }

  #text { flex: none; padding: .7rem 1rem; background: #111; border-top: 1px solid #333; font-size: 1rem; min-height: 1.4rem; }

  @media (max-width: 800px) {
    #split { flex-direction: column; }
    #left { border-right: none; border-bottom: 2px solid #333; }
  }
</style>
</head>
<body>

<div id="bar">
  <b class="title">Planet vs Earth</b>
  <span id="tabs"></span>
  <label>Site <select id="site"><option value="">- choose a site -</option></select></label>
  <span>
    <button id="clear">Clear</button>
  </span>
  <span>
    <label>Lat <input type="number" id="lat" value="0" step="any"></label>
    <label>Lon <input type="number" id="lon" value="0" step="any"></label>
    <button id="go">Go</button>
  </span>
  <span id="weights" title="Weights of the four feature blocks used to compare terrain windows (BLOCK_W in planet2vec.py)">
    <b>Weights</b>
    <label>Elev. scale <input type="number" id="w_elev_scale" min="0" step="any"></label>
    <label>Elev. shape <input type="number" id="w_elev_shape" min="0" step="any"></label>
    <label>Slope <input type="number" id="w_slope" min="0" step="any"></label>
    <label>Orientation <input type="number" id="w_orient" min="0" step="any"></label>
    <button id="recalc">Recalculate</button>
    <button id="wreset" title="Back to the weights and matches computed by planet2vec.py">Reset</button>
    <span id="wstatus"></span>
  </span>
</div>

<div id="split">
  <div class="pane" id="left"><div id="globe"></div>
    <div class="gpop" id="gpop" hidden>
      <div class="gpop-box"><a class="gpop-x" id="gpopx" href="#" role="button" aria-label="Close">&#215;</a><div class="gpop-content" id="gpopc"></div></div>
      <div class="gpop-tipc"><div class="gpop-tip"></div></div>
    </div>
  </div>
  <div class="pane" id="right"><div id="earth"></div></div>
</div>

<div id="text">Drag the globe to rotate, scroll to zoom, click a site or any other place.</div>

<script>
/* ---------- Settings ---------- */
const ENABLED = ['mars', 'moon'];
const SITES_URL = 'sites.json';           // made by export_sites.py (can be overridden with ?data=other.json)

const EARTH_ZOOM = 13;                    // Earth map zoom when a site is selected

const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

/* ---------- Device check: can this device handle the big textures? ---------- */
const isTouchDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 900);
const glTest = document.createElement('canvas').getContext('webgl2') ||
               document.createElement('canvas').getContext('webgl');
const maxTexture = glTest ? glTest.getParameter(glTest.MAX_TEXTURE_SIZE) : 2048;
const memGB = navigator.deviceMemory || 8;
const canUseHiRes = (width) =>
  !isTouchDevice && maxTexture >= width && (width < 16384 || memGB >= 8);

const BODIES = {
  mars: {
    label: 'Mars', radii: [3396190, 3396190, 3376200],
    texture: 'mars.jpg', textureHi: 'mars_hd.jpg', hiWidth: 16384,
    minCam: 1200000, minCamHi: 500000, flyHeight: 1500000,
    credit: 'NASA / JPL / USGS Viking MDIM 2.1'
  },
  moon: {
    label: 'Moon', radii: [1737400, 1737400, 1737400],
    texture: 'moon.jpg', textureHi: 'moon_hd.jpg', hiWidth: 8192,
    minCam: 600000, minCamHi: 300000, flyHeight: 900000,
    credit: 'NASA / LRO WAC'
  }
};

let key = ENABLED[0], B = BODIES[key];
let viewer = null, handler = null, ellipsoid = null;
let entities = [];
let SITES = [], siteEntities = [], popupPos = null;

const $ = (id) => document.getElementById(id);
const setText = (t) => { $('text').textContent = t; };
const HINT = 'Drag the globe to rotate, scroll to zoom, click a site or any other place.';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (lat, lon) => lat.toFixed(4) + ', ' + lon.toFixed(4);

/* ---------- Right side: Earth picture ---------- */
const earth = L.map('earth').setView([20, 0], 2);
L.tileLayer(ESRI, { maxZoom: 18, attribution: 'Esri, Maxar, Earthstar Geographics' }).addTo(earth);
const siteLayer = L.layerGroup().addTo(earth);   // all test sites
const overlay = L.layerGroup().addTo(earth);     // current selection

/* ---------- Left side: Mars / Moon globe ---------- */
function buildGlobe() {
  if (handler) { handler.destroy(); handler = null; }
  if (viewer) { viewer.destroy(); viewer = null; }

  ellipsoid = new Cesium.Ellipsoid(B.radii[0], B.radii[1], B.radii[2]);
  Cesium.Ellipsoid.default = ellipsoid;   // must be set before the Viewer is created

  const body = B;
  const load = (file) => Cesium.SingleTileImageryProvider.fromUrl(file, { ellipsoid, credit: body.credit });
  const wantHi = !!body.textureHi && canUseHiRes(body.hiWidth);
  let thisViewer = null;
  const providerPromise = wantHi
    ? load(body.textureHi)
        .then((p) => {
          if (thisViewer && thisViewer === viewer && body.minCamHi) {
            viewer.scene.screenSpaceCameraController.minimumZoomDistance = body.minCamHi;
          }
          return p;
        })
        .catch(() => load(body.texture))
    : load(body.texture);

  viewer = new Cesium.Viewer('globe', {
    baseLayer: Cesium.ImageryLayer.fromProviderAsync(providerPromise),
    baseLayerPicker: false, geocoder: false, homeButton: false,
    sceneModePicker: false, navigationHelpButton: false,
    animation: false, timeline: false, fullscreenButton: false,
    infoBox: false, selectionIndicator: false,
    skyAtmosphere: false
  });
  viewer.scene.globe.showGroundAtmosphere = false;
  viewer.scene.screenSpaceCameraController.minimumZoomDistance = B.minCam;
  thisViewer = viewer;
  viewer.scene.preRender.addEventListener(updateGlobePopup);

  handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  handler.setInputAction(onGlobeClick, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}

function onGlobeClick(click) {
  // Clicking one of the test sites
  const picked = viewer.scene.pick(click.position);
  if (picked && picked.id && picked.id.siteIdx !== undefined) { selectSite(picked.id.siteIdx); return; }
  // Clicking anywhere else: custom point on the globe only
  const cart = viewer.camera.pickEllipsoid(click.position, ellipsoid);
  if (!cart) return;
  const c = Cesium.Cartographic.fromCartesian(cart, ellipsoid);
  setPoint(Cesium.Math.toDegrees(c.latitude), Cesium.Math.toDegrees(c.longitude));
}

function addPin(lat, lon, color, size) {
  const e = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat, 0, ellipsoid),
    point: { pixelSize: size, color, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 }
  });
  entities.push(e);
  return e;
}

function clearSelection() {
  if (viewer) entities.forEach(e => viewer.entities.remove(e));
  entities = [];
  overlay.clearLayers();
  earth.closePopup();
  hideGlobePopup();
  $('site').value = '';
  setText(HINT);
}

/* ---------- Popup content (shared by the globe and the Earth map) ---------- */
// Name + coordinates and, if the site has a profile picture, a collapsible "Details..." with the image
function infoContent(name, lat, lon, profile, onResize, extra, noImageMsg) {
  onResize = onResize || (() => {});
  const box = document.createElement('div');
  box.className = 'info';
  const head = document.createElement('div');
  head.innerHTML = '<b>' + esc(name) + '</b><br>' + fmt(lat, lon) +
    (extra ? '<br><span class="dist">' + esc(extra) + '</span>' : '');
  box.appendChild(head);
  if (profile) {
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = 'Details...';
    const img = document.createElement('img');
    img.alt = 'Terrain profile: ' + name;
    img.loading = 'lazy';
    img.onload = onResize;
    img.onerror = () => {
      const msg = document.createElement('div');
      msg.textContent = 'Image not found: ' + profile;
      img.replaceWith(msg);
      onResize();
    };
    img.src = encodeURI(profile);
    const link = document.createElement('a');            // click the picture = open it full size
    link.href = encodeURI(profile); link.target = '_blank'; link.rel = 'noopener'; link.title = 'Open full size';
    link.appendChild(img);
    det.append(sum, link);
    det.addEventListener('toggle', onResize);
    box.appendChild(det);
  } else if (noImageMsg) {
    const m = document.createElement('div');
    m.className = 'noimg'; m.textContent = noImageMsg;
    box.appendChild(m);
  }
  return box;
}

/* ---------- Popup on the globe ---------- */
function showGlobePopup(name, lat, lon, profile) {
  popupPos = Cesium.Cartesian3.fromDegrees(lon, lat, 0, ellipsoid);
  $('gpopc').replaceChildren(infoContent(name, lat, lon, profile));
}
function hideGlobePopup() { popupPos = null; $('gpop').hidden = true; }
$('gpopx').onclick = (ev) => { ev.preventDefault(); hideGlobePopup(); };

function updateGlobePopup() {
  const p = $('gpop');
  if (!popupPos || !viewer) { p.hidden = true; return; }
  const facing = new Cesium.EllipsoidalOccluder(ellipsoid, viewer.camera.positionWC).isPointVisible(popupPos);
  const sp = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, popupPos);
  if (!facing || !sp) { p.hidden = true; return; }
  p.hidden = false;
  p.style.transform = 'translate(' + Math.round(sp.x - p.offsetWidth / 2) + 'px,' +
                      Math.round(sp.y - p.offsetHeight - 29) + 'px)';
}

/* ---------- Sites (loaded from sites.json) ---------- */
// Accepted formats:
//   {id, body: "mars" | "moon", site: {name, lat, lon}, earth: {name, lat, lon} or null, profile: "profiles/mars/1.png" (optional)}
//   [id, siteName, siteLat, siteLon, earthName, earthLat, earthLon, body, profile]   (last two optional)
// "earth" may be missing/null (site shown on the globe only); a missing name falls back to the id.
// Older files with a "mars" or "moon" key instead of "site" also work.
function normalizeSite(r) {
  let id, body, m, e, profile, extra = {};
  if (Array.isArray(r) && r.length >= 7) {
    id = r[0]; body = r[7]; profile = r[8];
    m = { name: r[1], lat: r[2], lon: r[3] }; e = { name: r[4], lat: r[5], lon: r[6] };
  } else if (r && (r.site || r.mars || r.moon)) {
    id = r.id; body = r.body || (r.moon && !r.mars && !r.site ? 'moon' : 'mars');
    m = r.site || r.mars || r.moon; e = r.earth; profile = r.profile;
    extra = { source: r.source || null, square: r.square, dist: r.dist, dist_rel: r.dist_rel, earthProfile: r.earth_profile || null };
    const mq = /kwadrat\s+(\d+)/.exec((m && m.name) || '');                                   // older sites.json: square from the name
    if (extra.square == null && mq) extra.square = +mq[1];
  } else return null;
  body = String(body || 'mars').toLowerCase();
  if (!BODIES[body]) return null;
  const has = (p) => p && p.lat != null && p.lon != null &&
    !isNaN(parseFloat(p.lat)) && !isNaN(parseFloat(p.lon)) && Math.abs(p.lat) <= 90;
  if (!has(m)) return null;
  const fix = (p) => {
    let lon = +p.lon; if (lon > 180) lon -= 360;
    return { name: p.name ? String(p.name) : String(id), lat: +p.lat, lon };
  };
  return { id, body, site: fix(m), earth: has(e) ? fix(e) : null, profile: profile ? String(profile) : null, ...extra };
}

/* Profile pictures (made by `node recalc.js profiles`):
   - Mars/Moon square:  profiles/<body>/<source>_<square>.png
   - Earth window:      profiles/earth/<file> found through profiles/earth/index.json (key = body|lat|lon) */
let EARTH_INDEX = null;
async function loadEarthIndex() {
  try {
    const r = await fetch('profiles/earth/index.json', { cache: 'no-store' });
    if (r.ok) EARTH_INDEX = await r.json();
  } catch (err) { /* no pictures generated yet */ }
}
function siteProfile(s) {
  if (s.profile) return s.profile;
  return s.source && s.square != null ? Planet2Vec.queryProfilePath(s.body, s.source, s.square) : null;
}
function earthProfile(s) {
  if (s.earthProfile) return s.earthProfile;
  if (s.earth && EARTH_INDEX) {
    for (const da of [0, 1e-4, -1e-4]) for (const dn of [0, 1e-4, -1e-4]) {
      const f = EARTH_INDEX[Planet2Vec.key4(s.body, s.earth.lat + da, s.earth.lon + dn)];
      if (f) return 'profiles/earth/' + f;
    }
  }
  return s.source ? null : s.profile;                    // hand-made entries: one picture for both sides
}
const earthNoImage = () => EARTH_INDEX
  ? 'No picture for this Earth window (it is outside the pre-rendered set).'
  : 'Pictures not generated yet - run: node recalc.js profiles';
const distText = (s) => s.dist != null ? 'distance ' + s.dist.toFixed(2) + ' (' + s.dist_rel.toFixed(2) + 'x median)' : '';

async function loadSites() {
  const url = new URLSearchParams(location.search).get('data') || SITES_URL;
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    SITES = (await r.json()).map(normalizeSite).filter(Boolean);
  } catch (err) {
    SITES = [];
    setText('Could not load ' + url + ' (' + err.message + '). Run export_sites.py and open this page through a local server: python -m http.server');
    return;
  }
  refreshSites();
}

// Shows only the sites of the current body (list, globe markers, Earth markers)
function refreshSites() {
  const sel = $('site');
  sel.length = 1;                              // keep the placeholder option
  SITES.forEach((s, i) => {
    if (s.body !== key) return;
    const o = document.createElement('option');
    o.value = i; o.textContent = s.id + '. ' + s.site.name + (s.earth ? ' \u2194 ' + s.earth.name : '');
    sel.appendChild(o);
  });
  drawSites();
  const onEarth = SITES.filter(s => s.body === key && s.earth);
  if (onEarth.length) earth.fitBounds(L.latLngBounds(onEarth.map(s => [s.earth.lat, s.earth.lon])), { padding: [30, 30], maxZoom: 6 });
}

function drawSites() {
  siteLayer.clearLayers();
  if (viewer) siteEntities.forEach(e => viewer.entities.remove(e));
  siteEntities = [];
  if (!viewer) return;
  SITES.forEach((s, i) => {
    if (s.body !== key) return;
    const pin = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(s.site.lon, s.site.lat, 0, ellipsoid),
      point: { pixelSize: 12, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 }
    });
    pin.siteIdx = i;
    siteEntities.push(pin);
    if (!s.earth) return;                      // no Earth counterpart: globe only
    L.circleMarker([s.earth.lat, s.earth.lon],
      { radius: 8, color: '#fff', weight: 2, fillColor: '#f00', fillOpacity: 1 })
      .bindTooltip(esc(s.earth.name))
      .on('click', () => selectSite(i))
      .addTo(siteLayer);
  });
}

function findSite(id) {
  const same = (s) => String(s.id) === String(id);
  const i = SITES.findIndex(s => s.body === key && same(s));
  return i >= 0 ? i : SITES.findIndex(same);
}

function selectSite(i) {
  const s = SITES[i];
  if (!s) return;
  if (key !== s.body) switchBody(s.body);
  clearSelection();
  $('site').value = i;
  const m = s.site, e = s.earth;

  // Globe side: highlighted pin + popup with name, coordinates and (if any) the profile picture
  addPin(m.lat, m.lon, Cesium.Color.YELLOW, 14);
  showGlobePopup(m.name, m.lat, m.lon, siteProfile(s));
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(m.lon, m.lat, B.flyHeight, ellipsoid), duration: 2
  });

  let text = 'Site ' + s.id + ': ' + B.label + ' - ' + m.name + ' (' + fmt(m.lat, m.lon) + ')';
  if (e) {
    // Earth side: highlighted marker + popup
    L.circleMarker([e.lat, e.lon], { radius: 10, color: '#fff', weight: 2, fillColor: '#ff0', fillOpacity: 1 }).addTo(overlay);
    earth.setView([e.lat, e.lon], EARTH_ZOOM);
    const pop = L.popup({ autoClose: false, closeOnClick: false, offset: [0, -6], maxWidth: 580 }).setLatLng([e.lat, e.lon]);
    pop.setContent(infoContent(e.name, e.lat, e.lon, earthProfile(s), () => pop.update(), distText(s), earthNoImage())).openOn(earth);
    text += '  \u2194  Earth - ' + e.name + ' (' + fmt(e.lat, e.lon) + ')';
  } else {
    text += '  (no Earth counterpart)';
  }
  setText(text);
}

/* ---------- Selecting any place (globe click, Go button, URL): shown on the globe only ---------- */
function setPoint(lat, lon, customText) {
  clearSelection();
  addPin(lat, lon, Cesium.Color.RED, 12);
  $('lat').value = lat.toFixed(4);
  $('lon').value = lon.toFixed(4);
  setText(customText || ('You are at coordinates ' + lat.toFixed(4) + ', ' + lon.toFixed(4) + ' on ' + B.label + '.'));
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, B.flyHeight, ellipsoid),
    duration: 2
  });
}

/* ---------- Tabs and UI ---------- */
const tabs = $('tabs');
ENABLED.forEach(k => {
  const b = document.createElement('button');
  b.textContent = BODIES[k].label; b.dataset.k = k;
  b.onclick = () => { switchBody(k); if (customWeights) recalcBody(k, customWeights).catch(weightsError); };
  tabs.appendChild(b);
});

function switchBody(k) {
  key = k; B = BODIES[k];
  entities = []; siteEntities = [];
  overlay.clearLayers();
  earth.closePopup();
  $('site').value = '';
  [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.k === key));
  buildGlobe();
  hideGlobePopup();
  refreshSites();
  setText(HINT);
}

$('clear').onclick = clearSelection;
$('site').onchange = () => { if ($('site').value !== '') selectSite(+$('site').value); };

$('go').onclick = () => {
  let lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 360) {
    setText('Enter a latitude between -90 and 90 and a longitude between -180 and 360.');
    return;
  }
  if (lon > 180) lon -= 360;
  setPoint(lat, lon);
};

/* ---------- Weights and recalculation (recalc.js) ---------- */
// Same algorithm as planet2vec.py (search + collect_hits), but with weights chosen here. Needs features/<body>.*
// made by `python planet2vec.py --features`.
const WKEYS = Planet2Vec.BLOCKS;
const FEATURES_URL = 'features/';
const featureDb = {};                         // body -> Promise<db>
let DEFAULTS = { ...Planet2Vec.DEFAULT_WEIGHTS };
let customWeights = null;                     // null = weights from planet2vec.py
let busy = false;

const readWeights = () => Object.fromEntries(WKEYS.map(b => [b, parseFloat($('w_' + b).value)]));
const writeWeights = (w) => WKEYS.forEach(b => { $('w_' + b).value = w[b]; });
const sameWeights = (a, b) => WKEYS.every(k => Math.abs(a[k] - b[k]) < 1e-12);
const wstatus = (t) => { $('wstatus').textContent = t || ''; };
const setBusy = (v) => { busy = v; $('recalc').disabled = v; $('wreset').disabled = v; };
const weightsError = (err) => { setBusy(false); wstatus(err.message + (/HTTP|fetch|Failed/i.test(err.message) ? ' - run: python planet2vec.py --features' : '')); };

function getFeatures(body) {
  if (!featureDb[body]) featureDb[body] = Planet2Vec.loadFeatures(body, FEATURES_URL).catch(err => { delete featureDb[body]; throw err; });
  return featureDb[body];
}

async function recalcBody(body, w) {
  setBusy(true);
  wstatus('Loading ' + BODIES[body].label + ' features...');
  const db = await getFeatures(body);
  DEFAULTS = Planet2Vec.defaultWeights(db);
  wstatus('Computing...');
  await new Promise(r => setTimeout(r, 30));          // let the status paint before the heavy loop
  const t0 = performance.now();
  const entries = Planet2Vec.computeEntries(db, w).map(normalizeSite).filter(Boolean);
  const ms = performance.now() - t0;
  SITES = SITES.filter(s => s.body !== body).concat(entries);
  if (body === key) { clearSelection(); refreshSites(); }
  customWeights = sameWeights(w, DEFAULTS) ? null : { ...w };
  setBusy(false);
  wstatus(BODIES[body].label + ': ' + entries.length + ' matches, ' + Math.round(ms) + ' ms' + (customWeights ? '' : ' (default weights)'));
}

$('recalc').onclick = () => {
  const w = readWeights();
  try { Planet2Vec.validateWeights(w); } catch (err) { wstatus(err.message); return; }
  recalcBody(key, w).catch(weightsError);
};
$('wreset').onclick = async () => {
  writeWeights(DEFAULTS);
  customWeights = null;
  clearSelection();
  await loadSites();                                  // back to the matches saved in sites.json
  wstatus('Weights reset.');
};
writeWeights(DEFAULTS);

/* ---------- Input from outside ---------- */
//   index.html?site=1                                   (select a site by its id; add &body=moon for the Moon)
//   index.html?data=other.json                          (use another data file)
//   index.html?body=mars&lat=18.38&lon=77.58&text=Jezero%20Crater
function applyUrlParameters() {
  const P = new URLSearchParams(location.search);
  const want = P.get('body');
  if (want && BODIES[want] && ENABLED.includes(want) && want !== key) switchBody(want);
  const num = (name) => parseFloat(P.get(name));
  const text = P.get('text') || undefined;
  if (P.has('site')) {
    const i = findSite(P.get('site'));
    if (i >= 0) selectSite(i);
  } else if (P.has('lat') && P.has('lon')) {
    let lat = num('lat'), lon = num('lon');
    if (!isNaN(lat) && !isNaN(lon) && Math.abs(lat) <= 90 && lon >= -180 && lon <= 360) {
      if (lon > 180) lon -= 360;
      setPoint(lat, lon, text);
    }
  }
}

window.showPlace = function (body, lat, lon, text) {
  if (body && BODIES[body] && ENABLED.includes(body) && body !== key) switchBody(body);
  setPoint(lat, lon > 180 ? lon - 360 : lon, text);
};
window.showSite = (id) => selectSite(findSite(id));

switchBody(key);
Promise.all([loadSites(), loadEarthIndex()]).then(applyUrlParameters);
</script>
</body>
