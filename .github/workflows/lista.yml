name: Lista plikow
on:
  workflow_dispatch:
  push:
    paths: ['earth/**']
permissions:
  contents: write
jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ls data | jq -R . | jq -s . > files.json
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add files.json
          git diff --cached --quiet || (git commit -m "update files.json" && git push)
